[project]
name = "lora-link-budget"
version = "0.1.0"
description = "LoRa/LoRaWAN link budget, range, airtime, duty-cycle and battery-life estimator."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
